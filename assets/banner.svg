<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.tag{font-weight:600;font-size:13px;fill:#a855f7;letter-spacing:2px}.floating-bg{animation:floatParticle 6s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><g class="floating-bg" opacity=".25"><circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)"/><circle cx="1050" cy="270" r="150" fill="#ec4899" filter="url(#glow)"/><rect width="180" height="180" x="900" y="40" fill="#a855f7" filter="url(#glow)" rx="30" transform="rotate(15 990 130)"/></g><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M200 0 V350 M400 0 V350 M600 0 V350 M800 0 V350 M1000 0 V350"/><rect width="1196" height="346" x="2" y="2" fill="none" stroke="url(#accentGrad)" stroke-opacity=".6" stroke-width="3" rx="14"/><g transform="translate(60, 0)"><rect width="240" height="28" x="0" y="55" fill="#a855