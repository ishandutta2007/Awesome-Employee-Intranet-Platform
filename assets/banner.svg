<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #a855f7; letter-spacing: 2px; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    .floating-bg { animation: floatParticle 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic/Animated background shapes (low opacity behind text) -->
  <g opacity="0.25" class="floating-bg">
    <circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)" />
    <circle cx="1050" cy="270" r="150" fill="#ec4899" filter="url(#glow)" />
    <rect x="900" y="40" width="180" height="180" rx="30" fill="#a855f7" transform="rotate(15 990 130)" filter="url(#glow)" />
  </g>

  <!-- Decorative Grid lines -->
  <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M200 0 V350 M400 0 V350 M600 0 V350 M800 0 V350 M1000 0 V350" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Border Accent -->
  <rect x="2" y="2" width="1196" height="346" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.6" />

  <!-- Center Content Container (Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="240" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4" />
    <text x="120" y="74" text-anchor="middle" class="tag">DIGITAL WORKPLACE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Employee Intranet Platforms 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">A Curated Directory of SaaS Solutions &amp; Open-Source GitHub Repositories</text>
    <text x="0" y="210" class="subtitle" font-size="16px" opacity="0.8">Internal Communications • Knowledge Sharing • Employee Engagement • Self-Hosted Hubs</text>

    <!-- Feature Pills Foreground -->
    <g transform="translate(0, 250)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="24" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-weight="600" font-size="14px">⚡ SaaS &amp; Open Source</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="275" y="24" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-weight="600" font-size="14px">💰 Pricing &amp; Market Data</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="465" y="24" text-anchor="middle" fill="#f472b6" font-family="system-ui" font-weight="600" font-size="14px">⭐ Sorted by Stars</text>
    </g>
  </g>
</svg>
